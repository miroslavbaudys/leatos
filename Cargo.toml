[workspace]
resolver = "3"
members = ["kernel", "crates/*", "tools/*"]
# `cargo build` / `cargo test` at the root only touch host-testable crates.
# `tools/*` are host tools (std). The kernel is built through the `cargo kbuild` / `cargo krun` aliases
# (see .cargo/config.toml) because it needs --target aarch64-unknown-none.
default-members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/miroslavbaudys/leatos"

[workspace.dependencies]
proto-pppoe = { path = "crates/proto-pppoe" }
proto-dhcp = { path = "crates/proto-dhcp" }
proto-dns = { path = "crates/proto-dns" }
proto-sntp = { path = "crates/proto-sntp" }
fwd = { path = "crates/fwd" }
qdisc = { path = "crates/qdisc" }
boot-image = { path = "crates/boot-image" }
proto-http = { path = "crates/proto-http" }
config-store = { path = "crates/config-store" }
config = { path = "crates/config" }
cli = { path = "crates/cli" }
auth = { path = "crates/auth" }
proto-mdns = { path = "crates/proto-mdns" }
proto-dot = { path = "crates/proto-dot" }
proto-tcp = { path = "crates/proto-tcp" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

[profile.release]
debug = true      # keep symbols for gdb; they are not loaded into guest memory
lto = "thin"

# DNS over TLS (crates/proto-dot): public-key math unoptimised makes a
# TLS handshake take seconds in a debug kernel (the services task, and on
# one core the datapath, would stall); optimise the crypto crates even in
# debug builds. The rest stays debuggable.
[profile.dev.package]
rustls = { opt-level = 3 }
rustls-webpki = { opt-level = 3 }
p256 = { opt-level = 3 }
p384 = { opt-level = 3 }
primeorder = { opt-level = 3 }
elliptic-curve = { opt-level = 3 }
ecdsa = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
rsa = { opt-level = 3 }
primefield = { opt-level = 3 }
curve25519-dalek = { opt-level = 3 }
ed25519-dalek = { opt-level = 3 }
x25519-dalek = { opt-level = 3 }
sha2 = { opt-level = 3 }
hmac = { opt-level = 3 }
aes = { opt-level = 3 }
aes-gcm = { opt-level = 3 }
ghash = { opt-level = 3 }
polyval = { opt-level = 3 }
chacha20 = { opt-level = 3 }
chacha20poly1305 = { opt-level = 3 }
poly1305 = { opt-level = 3 }
