# Do NOT set `build.target` here: it would force the host-testable
# protocol crates onto the bare-metal target too. Use the aliases instead.

[alias]
kbuild = "build -p rrouter-kernel --target aarch64-unknown-none"
krun = "run -p rrouter-kernel --target aarch64-unknown-none"
kclippy = "clippy -p rrouter-kernel --target aarch64-unknown-none"
kcheck-x86 = "check -p rrouter-kernel --target x86_64-unknown-none"
kbuild-x86 = "build -p rrouter-kernel --target x86_64-unknown-none"
krun-x86 = "run -p rrouter-kernel --target x86_64-unknown-none"
kclippy-x86 = "clippy -p rrouter-kernel --target x86_64-unknown-none"
ksmoke = "run -p rrouter-kernel --target aarch64-unknown-none --features smoke-test"

[target.aarch64-unknown-none]
# `cargo krun` hands the built ELF to this script, which boots it in QEMU.
runner = "scripts/qemu-run.sh"

[target.x86_64-unknown-none]
runner = "scripts/qemu-run.sh"
# The target defaults to a static PIE; the kernel is linked at a fixed
# physical address (identity map), and boot.S uses absolute addresses.
rustflags = [
    "-C", "relocation-model=static",
    # No SSE on this target (soft-float kernel): RustCrypto's SIMD
    # backends (DNS over TLS, crates/proto-dot) must use their software
    # versions; sha2 gets its `force-soft` feature there.
    "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft",
    "--cfg", "poly1305_force_soft", "--cfg", "chacha20_force_soft",
    "--cfg", 'curve25519_dalek_backend="serial"',
]
