[package]
name = "auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Management authentication: PBKDF2-SHA256 password hashes, an entropy pool, session tokens."

[dependencies]
sha2 = { version = "0.11", default-features = false }  # x86_64 kernel: software backend via --cfg (.cargo/config.toml)
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }

[lints]
workspace = true
