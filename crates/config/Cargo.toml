[package]
name = "config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Router configuration: schema with defaults, validation, config.toml parsing and writing."

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
auth = { workspace = true }
proto-mdns = { workspace = true }
# PEM parsing for `dns.tls_ca` (no_std).
rustls-pki-types = { version = "1.16", default-features = false, features = ["alloc"] }
toml = { version = "1.2", default-features = false, features = ["serde", "parse", "display"] }

[lints]
workspace = true
