<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rrouter</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6eb; --ok:#15803d; --bad:#b91c1c; --accent:#2563eb;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f26; --fg:#e6e9ee; --muted:#9aa3af; --line:#2a313b; --ok:#4ade80; --bad:#f87171; --accent:#60a5fa;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header span { color:var(--muted); }
  main { padding:16px; display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); max-width:1200px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; min-width:0; }
  h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:3px 6px 3px 0; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  th { color:var(--muted); font-weight:500; }
  .up { color:var(--ok); } .down { color:var(--bad); }
  .wide { grid-column:1 / -1; }
  input, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); max-width:100%; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.danger { background:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  #msg { white-space:pre-wrap; color:var(--muted); }
  .warn { color:var(--bad); font-weight:600; }
  .stat { display:flex; gap:20px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
  .stat b { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); }
  .legend { display:flex; gap:14px; color:var(--muted); font-size:13px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .chart { position:relative; }
  .chart svg { display:block; width:100%; height:170px; touch-action:none; }
  .chart .grid { stroke:var(--line); stroke-width:1; }
  .chart text { fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .chart .hair { stroke:var(--muted); stroke-width:1; }
  .tip { position:absolute; top:4px; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:6px;
         padding:6px 8px; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .tip i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  details { margin-top:6px; color:var(--muted); }
</style>
</head>
<body>
<header><h1>rrouter</h1><span id="ver">…</span><span id="up"></span><span id="wanwarn" class="warn"></span></header>
<main>
  <section class="wide"><h2>CPU load per core</h2>
    <div class="legend"><span><i style="background:var(--s1)"></i>Datapath (forwarding, CAKE)</span><span><i style="background:var(--s2)"></i>Services (DHCP, DNS, web)</span><span><i style="background:var(--s3)"></i>Other (IRQs, timers)</span></div>
    <div id="cpucharts"></div>
    <details><summary>Last 10 seconds as a table</summary><table id="cputab"></table></details>
  </section>
  <section class="wide"><h2>Interfaces</h2><table id="ifs"></table></section>
  <section><h2>WAN lease</h2><table id="wan"></table></section>
  <section><h2>System</h2><table id="sys"></table></section>
  <section class="wide"><h2>DHCP leases</h2><table id="leases"></table></section>
  <section class="wide"><h2>Upgrade (in RAM; a power cycle boots the SD card again)</h2>
    <div class="row"><input id="pass" type="password" placeholder="admin password (mgmt_pass)" autocomplete="current-password"></div>
    <div class="row"><input id="file" type="file"><input id="cmd" placeholder="kernel command line (empty = keep current)" size="40"></div>
    <div class="row"><button id="go">Upload and start</button><button id="reboot" class="danger">Reboot</button></div>
    <div id="msg"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n = (x) => Number(x).toLocaleString();
const rows = (pairs) => pairs.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join("");
const dur = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + "d " : "") + h + "h " + m + "m " + (s % 60) + "s"; };

// CPU load per core: cpu.cores[c] = samples [busy, datapath, service] in
// permille, oldest first, one per second. Stacked from the bottom: datapath
// (forwarding tasks), services (router stack, DHCP, DNS, this web server),
// other (the rest of busy: IRQs, timers, the executor). One chart per core
// (small multiples, same scale).
let cpuCores = [], cpuEv = [], cpuInterval = 1;
const pct = (p) => (p / 10).toFixed(1) + " %";
function cpuChart(c) {
  if (!$("cpu" + c)) {
    const box = document.createElement("div");
    box.innerHTML = `<div class="stat"><div><b>Core ${c}</b></div><div><b id="cpunow${c}">–</b> <span>last second</span></div>` +
      `<div><b id="cpuavg${c}">–</b> <span id="cpuavgl${c}">average</span></div></div>` +
      `<div class="chart"><svg id="cpu${c}" role="img" aria-label="CPU load of core ${c} over the last 5 minutes"></svg><div id="cputip${c}" class="tip" hidden></div></div>`;
    $("cpucharts").append(box);
    $("cpu" + c).addEventListener("pointermove", (ev) => cpuHover(c, ev));
    $("cpu" + c).addEventListener("pointerleave", () => {
      cpuEv[c] = null; $("cputip" + c).hidden = true;
      const h = $("hair" + c); if (h) h.setAttribute("visibility", "hidden");
    });
  }
  return $("cpu" + c);
}
function drawCpu(c) {
  const svg = cpuChart(c), s = cpuCores[c] || [], N = 300;
  const W = Math.max(svg.clientWidth, 200), H = cpuCores.length > 1 ? 120 : 170, L = 40, R = 6, T = 8, B = 20;
  svg.style.height = H + "px";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x = (i) => L + (W - L - R) * (N - s.length + i) / (N - 1);
  const y = (v) => T + (H - T - B) * (1 - Math.min(v, 1000) / 1000);
  let g = "";
  for (const v of [0, 500, 1000]) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v / 10} %</text>`;
  }
  g += `<text x="${L}" y="${H - 4}">5 min ago</text><text x="${W - R}" y="${H - 4}" text-anchor="end">now</text>`;
  if (s.length >= 2) {
    const pts = (f) => s.map((d, i) => `${x(i).toFixed(1)},${y(f(d)).toFixed(1)}`);
    const dp = pts((d) => d[1]), sv = pts((d) => d[1] + d[2]), tot = pts((d) => Math.max(d[0], d[1] + d[2]));
    const x0 = x(0).toFixed(1), xn = x(s.length - 1).toFixed(1), y0 = y(0);
    const band = (top, bottom) => `M${top.join("L")}L${bottom.slice().reverse().join("L")}Z`;
    g += `<path d="M${x0},${y0}L${dp.join("L")}L${xn},${y0}Z" fill="var(--s1)" fill-opacity=".16"/>`;
    g += `<path d="${band(sv, dp)}" fill="var(--s2)" fill-opacity=".16"/>`;
    g += `<path d="${band(tot, sv)}" fill="var(--s3)" fill-opacity=".16"/>`;
    for (const [p, col] of [[tot, "--s3"], [sv, "--s2"], [dp, "--s1"]]) {
      g += `<polyline points="${p.join(" ")}" fill="none" stroke="var(${col})" stroke-width="2" stroke-linejoin="round"/>`;
    }
  } else {
    g += `<text x="${(L + W) / 2}" y="${H / 2}" text-anchor="middle">collecting…</text>`;
  }
  g += `<line id="hair${c}" class="hair" y1="${T}" y2="${H - B}" visibility="hidden"/>`;
  svg.innerHTML = g;
  svg.cpuMap = { x, L, R, W, N };
  if (cpuEv[c]) cpuHover(c, cpuEv[c]);
}
function cpuHover(c, ev) {
  cpuEv[c] = ev;
  const svg = $("cpu" + c), m = svg.cpuMap, s = cpuCores[c] || [];
  if (!m || !s.length) return;
  const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * m.W / r.width;
  const i = Math.max(0, Math.min(s.length - 1, Math.round((px - m.L) / (m.W - m.L - m.R) * (m.N - 1)) - (m.N - s.length)));
  const [busy, dp, sv] = s[i], hx = m.x(i), ago = s.length - 1 - i;
  const h = $("hair" + c);
  h.setAttribute("x1", hx); h.setAttribute("x2", hx); h.setAttribute("visibility", "visible");
  const tip = $("cputip" + c), line = (color, label, v) => {
    const d = document.createElement("div");
    if (color) { const k = document.createElement("i"); k.style.background = color; d.append(k); }
    d.append(label + (v === undefined ? "" : ": " + pct(v)));
    return d;
  };
  tip.replaceChildren(line(null, `core ${c}, ` + (ago ? `${ago} s ago` : "last second")),
    line("var(--s1)", "Datapath", dp), line("var(--s2)", "Services", sv), line("var(--s3)", "Other", Math.max(busy - dp - sv, 0)), line(null, "Total", busy));
  tip.hidden = false;
  const left = hx * r.width / m.W;
  tip.style.left = (left + 12 + tip.offsetWidth > r.width ? left - 12 - tip.offsetWidth : left + 12) + "px";
}
window.addEventListener("resize", () => cpuCores.forEach((_, c) => drawCpu(c)));
function showCpu(cpu) {
  cpuCores = cpu.cores; cpuInterval = cpu.interval_s;
  cpuCores.forEach((s, c) => {
    cpuChart(c);
    const last = s[s.length - 1];
    $("cpunow" + c).textContent = last ? pct(last[0]) : "–";
    $("cpuavg" + c).textContent = s.length ? pct(s.reduce((a, d) => a + d[0], 0) / s.length) : "–";
    const secs = s.length * cpuInterval;
    $("cpuavgl" + c).textContent = secs >= 60 ? `average, last ${Math.round(secs / 60)} min` : `average, last ${secs} s`;
    drawCpu(c);
  });
  const head = cpuCores.map((_, c) => `<th>Core ${c}: total / datapath / services</th>`).join("");
  const rows10 = [];
  for (let i = 0; i < 10; i++) {
    const cells = cpuCores.map((s) => { const d = s[s.length - 1 - i]; return `<td>${d ? `${pct(d[0])} / ${pct(d[1])} / ${pct(d[2])}` : "–"}</td>`; }).join("");
    rows10.push(`<tr><td>${i}</td>${cells}</tr>`);
  }
  $("cputab").innerHTML = `<tr><th>Seconds ago</th>${head}</tr>` + rows10.join("");
}

async function refresh() {
  let st;
  try { st = await (await fetch("/api/status", {cache: "no-store"})).json(); }
  catch (e) { $("up").textContent = "offline"; return; }
  if (st.cpu) showCpu(st.cpu);
  $("ver").textContent = `v${st.version} · ${st.arch}`;
  $("up").textContent = "up " + dur(st.uptime_s);
  $("wanwarn").textContent = st.mgmt.on_wan ? "management open on WAN (mgmt=wan)" : "";
  $("ifs").innerHTML = "<tr><th>Port</th><th>NIC</th><th>MAC</th><th>Link</th><th>Address</th><th>RX pkts</th><th>TX pkts</th><th>Shaper</th><th>Qdisc sent / drops / ECN / backlog</th></tr>" +
    st.interfaces.map((i) => `<tr><td>${esc(i.name)}</td><td>${esc(i.model)}</td><td>${esc(i.mac)}</td>` +
      `<td>${i.link === null ? "–" : i.link.up ? `<span class="up">up ${i.link.mbps} Mbit/s${i.link.full_duplex ? "" : " half"}</span>` : '<span class="down">down</span>'}</td>` +
      `<td>${i.addrs.map(esc).join("<br>") || "–"}</td><td>${n(i.rx_packets)}</td><td>${n(i.tx_packets)}</td>` +
      `<td>${i.qdisc.shaped_kbit === null ? "unshaped" : n(i.qdisc.shaped_kbit) + " kbit/s"}</td>` +
      `<td>${n(i.qdisc.sent)} / ${n(i.qdisc.dropped)} / ${n(i.qdisc.ecn_marked)} / ${n(i.qdisc.backlog_packets)}</td></tr>`).join("");
  const l = st.wan_lease;
  $("wan").innerHTML = l ? rows([["Address", esc(l.addr)], ["Gateway", esc(l.gateway ?? "–")], ["DNS", l.dns.map(esc).join(", ") || "–"]]) : rows([["Lease", "none"]]);
  $("sys").innerHTML = rows([
    ["Forwarded", n(st.forwarded)], ["Dropped", n(st.dropped)], ["Connections", n(st.conntrack)],
    ["Packet pool", `${n(st.pool.free)} free of ${n(st.pool.capacity)}` + (st.pool.alloc_failures ? `, ${n(st.pool.alloc_failures)} failures` : "")],
    ["Heap", `${n(Math.round(st.heap.used / 1024))} KiB used, ${n(Math.round(st.heap.free / 1048576))} MiB free`],
    ["Upgrade", st.mgmt.upgrade ? "enabled" : "disabled (boot with mgmt_pass=…)"]]);
  $("leases").innerHTML = st.dhcp_leases.length
    ? "<tr><th>Host</th><th>IP</th><th>MAC</th><th>State</th><th>Expires in</th></tr>" + st.dhcp_leases.map((d) =>
        `<tr><td>${esc(d.hostname ?? "–")}</td><td>${esc(d.ip)}</td><td>${esc(d.mac)}</td><td>${d.bound ? "bound" : "offered"}</td><td>${dur(d.expires_in_s)}</td></tr>`).join("")
    : rows([["Leases", "none"]]);
}

const auth = () => ({ Authorization: "Basic " + btoa("admin:" + $("pass").value) });
const say = (t) => { $("msg").textContent = t; };

$("go").onclick = async () => {
  const f = $("file").files[0];
  if (!f) return say("Choose a kernel ELF first.");
  const headers = auth();
  if ($("cmd").value.trim()) headers["X-Cmdline"] = $("cmd").value.trim();
  say(`Uploading ${n(f.size)} bytes…`);
  try {
    const r = await fetch("/api/upgrade", { method: "POST", headers, body: f });
    const j = await r.json();
    if (!j.ok) return say(`Refused (${r.status}): ${j.error}`);
    say(`Accepted: ${j.detail}\nStarting the new kernel; this page reconnects by itself.`);
  } catch (e) { say("Upload failed: " + e); }
};
$("reboot").onclick = async () => {
  if (!confirm("Reboot the router?")) return;
  try {
    const r = await fetch("/api/reboot", { method: "POST", headers: auth() });
    const j = await r.json();
    say(j.ok ? "Rebooting…" : `Refused (${r.status}): ${j.error}`);
  } catch (e) { say("Request failed: " + e); }
};
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
