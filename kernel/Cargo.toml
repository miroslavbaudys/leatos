[package]
name = "leatos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "leatos bare-metal aarch64 unikernel (QEMU virt)"

[[bin]]
name = "leatos"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["neigh-cache-256"]
# smoltcp's neighbor cache per network (IPv4 and IPv6 together; its
# default is 8): a home LAN with ~20 devices and several IPv6 addresses
# each evicted entries all the time, and answers to evicted ones (DNS,
# DHCP, ping, the web interface) were dropped while smoltcp asked again
# (apu4, 2026-11-22). `--no-default-features` builds the old size: the
# lab's negative control (LAB_NEIGH_CACHE=8).
neigh-cache-256 = ["smoltcp/iface-neighbor-cache-count-256"]
# Print the boot report, then power off via PSCI so QEMU exits (used by scripts/smoke-test.sh).
smoke-test = []
# Idle by spinning instead of `wfi`: lowest timer latency on hypervisors
# whose WFI wake-up is slow (macOS HVF), at the cost of 100% host CPU.
idle-poll = []
# Deliberate crashes, used by scripts/smoke-test.sh to verify memory protection.
fault-wx = ["smoke-test"]
fault-stack = ["smoke-test"]
# After "boot ok": hang in a task (watchdog tests: the cross-core check,
# or with cores=1 the hardware timer), or panic (panic -> reboot).
fault-hang = ["smoke-test"]
fault-panic = ["smoke-test"]

[dependencies]
proto-dhcp.workspace = true
proto-dns.workspace = true
proto-sntp.workspace = true
proto-pppoe.workspace = true
fwd.workspace = true
qdisc.workspace = true
boot-image.workspace = true
proto-http.workspace = true
config.workspace = true
auth.workspace = true
proto-mdns.workspace = true
proto-dot.workspace = true
cli.workspace = true
config-store.workspace = true
linked_list_allocator = "0.10"
spin = { version = "0.12", default-features = false, features = ["spin_mutex", "once"] }
virtio-drivers = { version = "0.13", default-features = false }
safe-mmio = "0.4"
smoltcp = { version = "0.14", default-features = false, features = [
    "alloc", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6",
    "socket-icmp", "socket-udp", "socket-tcp", "socket-dhcpv4", "socket-dns",
    "auto-icmp-echo-reply", # the router answers pings on its own addresses
    "multicast",            # 224.0.0.251 for the mDNS reflector (net::mdns)
    "iface-max-route-count-32", # `[[route]]`s (at most 16) + the default route
    # IPv6 (M7, docs/ipv6.md): per link IPv4 + link-local + ULA + global;
    # groups ff02::1/ff02::2, solicited-node per address, ff02::fb, 224.0.0.251
    "iface-max-addr-count-4",
    "iface-max-multicast-group-count-8",
] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
fdt = "0.1.5"
aarch64-cpu = "12"

[lints]
workspace = true
